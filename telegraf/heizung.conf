# =====================================================================
#  Telegraf: MQTT (192.168.20.4) -> InfluxDB
#  Datei nach /etc/telegraf/telegraf.d/heizung.conf kopieren, Output anpassen,
#  dann: telegraf --config /etc/telegraf/telegraf.conf --config-directory /etc/telegraf/telegraf.d --test
#
#  Ergebnis in InfluxDB:
#    measurement heizung_calc     Leistungen + Zählerstände     (heizung/calc/<name>)
#    measurement heizung_diag     Methoden aktiv, Alter Eingänge (heizung/diag/<name>)
#    measurement heizung_analyse  Kennzahlen                    (heizung/analyse/<name>)
#    measurement heizung_tag      Tageswerte, Zeit = Mitternacht des Tages (heizung/tag/json)
# =====================================================================

# ---------- Einzelwerte (eine Zahl pro Topic) ----------
[[inputs.mqtt_consumer]]
  servers = ["tcp://192.168.20.4:1883"]
  # username = ""
  # password = ""
  client_id = "telegraf-heizung"
  topics = [
    "heizung/calc/+",
    "heizung/diag/+",
    "heizung/analyse/+",
    # Rohwerte hier ergänzen, falls sie nicht schon anderweitig in InfluxDB landen
    # (Schema heizung/<quelle>/<signal>, reine Zahlen), z.B.:
    # "heizung/loxone/+",
  ]
  qos = 0
  data_format = "value"
  data_type = "float"
  name_override = "heizung"
  topic_tag = ""
  tagexclude = ["host"]

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "heizung/+/+"
    tags = "_/quelle/signal"

# heizung/<quelle>/<signal>  ->  measurement heizung_<quelle>, Feld <signal>
[[processors.starlark]]
  namepass = ["heizung"]
  source = '''
def apply(metric):
    q = metric.tags.pop("quelle", None)
    s = metric.tags.pop("signal", None)
    if q:
        metric.name = "heizung_" + q
    if s and "value" in metric.fields:
        metric.fields[s] = metric.fields.pop("value")
    return metric
'''

# ---------- Tageswerte (JSON mit eigenem Zeitstempel) ----------
[[inputs.mqtt_consumer]]
  servers = ["tcp://192.168.20.4:1883"]
  client_id = "telegraf-heizung-tag"
  topics = ["heizung/tag/json"]
  qos = 1
  data_format = "json_v2"
  topic_tag = ""
  tagexclude = ["host"]
  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "heizung_tag"
    [[inputs.mqtt_consumer.json_v2.object]]
      path = "@this"
      timestamp_key = "ts"
      timestamp_format = "unix"
      excluded_keys = ["datum"]

# ---------- Output: InfluxDB 2.x ----------
[[outputs.influxdb_v2]]
  namepass = ["heizung_*"]
  urls = ["http://INFLUX_HOST:8086"]
  token = "$INFLUX_TOKEN"
  organization = "home"
  bucket = "heizung"

